packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAge: 1440
# The deploy host rejects releases newer than 24 hours. These are the
# patched packages from this upgrade that are still inside that window.
minimumReleaseAgeExclude:
  - '@clerk/backend'
  - '@clerk/react'
  - '@clerk/shared'
  - '@clerk/tanstack-react-start'
  - '@tanstack/query-core'
  - '@tanstack/react-query'
  - electron-to-chromium
  - nitro-nightly
  - srvx
  - stream-chain
allowBuilds:
  '@clerk/shared': false
  bufferutil: false
  core-js: false
  esbuild: false
  utf-8-validate: false
overrides:
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'seroval@>=0.12.0 <1.6.3': 1.6.12
  'shell-quote@>=1.1.0 <1.9.0': 1.12.0
  'h3@>=2.0.0 <2.0.2': 2.0.8
  'h3@2.0.1-rc.20': 2.0.8
  'hono@>=4.0.0 <4.13.11': 4.13.14
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'ws@>=7.0.0 <7.5.11': 7.5.13
  'browserslist@<4.28.7': 4.28.7
  'image-size@>=2.0.0 <2.0.3': 2.0.4
  'js-cookie@<=3.0.5': 3.0.8
  'launch-editor@<2.14.2': 2.14.2
  'source-map-js@<1.2.2': 1.2.2
  'stream-json@<3.6.0': 3.6.0
  'uuid@>=11.0.0 <11.1.1': 11.1.1
  'baseline-browser-mapping@<2.11.0': 2.11.33
  'tinypool@>=2.0.0 <2.1.2': 2.1.2
  'vite@>=7.0.0 <7.3.7': 7.3.7
