# DevCents self-hosted stack: Postgres + Convex backend + DevCents.
# Full guide: docs/self-hosting.md
#
#   cp .env.example .env            # fill in the values
#   docker compose up -d postgres convex
#   docker compose exec convex ./generate_admin_key.sh   # → CONVEX_SELF_HOSTED_ADMIN_KEY in .env
#   docker compose up -d
#
# Put a TLS-terminating reverse proxy in front of ports 3000 (app) and 3210
# (Convex); see deployment/compose.caddy.yml for a ready-made one.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${INSTANCE_NAME:-devcents}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  convex:
    # Pin this to a specific tag or digest for reproducible upgrades.
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONVEX_BIND_ADDRESS:-127.0.0.1}:3210:3210"
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-devcents}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?INSTANCE_SECRET is required (openssl rand -hex 32)}
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432
      DO_NOT_REQUIRE_SSL: "true"
      CONVEX_CLOUD_ORIGIN: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      DISABLE_BEACON: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  functions:
    image: ghcr.io/infinit3hq/devcents-functions:${DEVCENTS_VERSION:-latest}
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: functions
    restart: "no"
    depends_on:
      convex:
        condition: service_healthy
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      # Empty on first boot; deploy-functions explains how to generate it.
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL:?CLERK_ISSUER_URL is required}
      DEVCENTS_SERVER_SECRET: ${DEVCENTS_SERVER_SECRET:?DEVCENTS_SERVER_SECRET is required (openssl rand -hex 32)}

  web:
    image: ghcr.io/infinit3hq/devcents:${DEVCENTS_VERSION:-latest}
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      functions:
        condition: service_completed_successfully
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - web-output:/app/.output
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required (e.g. https://money.example.com)}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      VITE_CONVEX_URL: ${VITE_CONVEX_URL}
      CONVEX_URL: http://convex:3210
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      DEVCENTS_SERVER_SECRET: ${DEVCENTS_SERVER_SECRET}
      # Optional, single-user only: lets standard MCP tokens decrypt without a
      # per-token key. Leave empty unless you understand the trade-off.
      DEVCENTS_PASSPHRASE: ${DEVCENTS_PASSPHRASE:-}

volumes:
  postgres-data:
  convex-data:
  web-output:
