# Web-only deployment behind an existing Traefik, talking to a Convex backend
# hosted elsewhere. Used by .github/workflows/deploy.yml.
#   docker compose -f deployment/compose.traefik.yml up -d
#
# The project name matches what the old root-level compose file used (the
# checkout directory), so upgrades replace the running container instead of
# starting a second one behind the same Traefik router.
name: devcents

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/infinit3hq/devcents:latest}
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: web
    restart: unless-stopped
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PUBLIC_URL: https://${TRAEFIK_WEB_HOST:?TRAEFIK_WEB_HOST is required}
      TRUST_PROXY: "true"
      VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      DEVCENTS_SERVER_SECRET: ${DEVCENTS_SERVER_SECRET:?DEVCENTS_SERVER_SECRET is required}
      DEVCENTS_PASSPHRASE: ${DEVCENTS_PASSPHRASE:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devcents-web.rule=Host(`${TRAEFIK_WEB_HOST}`)"
      - "traefik.http.routers.devcents-web.entrypoints=websecure"
      - "traefik.http.routers.devcents-web.tls.certresolver=cloudflare"
      - "traefik.http.services.devcents-web.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
