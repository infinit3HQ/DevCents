name: Build, Publish and Release

# Every push to main is a release: it gets a dated version tag, a GitHub
# release, and two multi-arch images on GHCR:
#   ghcr.io/infinit3hq/devcents            (web app)
#   ghcr.io/infinit3hq/devcents-functions  (Convex functions deployer)
# Both are tagged <version>, sha-<short>, and latest.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/infinit3hq/devcents
  FUNCTIONS_IMAGE: ghcr.io/infinit3hq/devcents-functions

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter devcents test

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "tag=v$(date -u +'%Y.%m.%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,format=short
            type=raw,value=latest

      - name: Functions image metadata
        id: fn-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FUNCTIONS_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,format=short
            type=raw,value=latest

      - name: Build web image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          target: web
          load: true
          tags: devcents-web:scan
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devcents-web:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Build and push web image
        id: web-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push functions image
        id: fn-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          target: functions
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.fn-meta.outputs.tags }}
          labels: ${{ steps.fn-meta.outputs.labels }}
          cache-from: type=gha,scope=functions
          cache-to: type=gha,mode=max,scope=functions

      - name: Attest web image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web-push.outputs.digest }}
          push-to-registry: true

      - name: Attest functions image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.FUNCTIONS_IMAGE }}
          subject-digest: ${{ steps.fn-push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          WEB_DIGEST: ${{ steps.web-push.outputs.digest }}
          FN_DIGEST: ${{ steps.fn-push.outputs.digest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          {
            echo "## Docker images"
            echo
            echo '```'
            echo "${WEB_IMAGE}:${TAG}"
            echo "${WEB_IMAGE}@${WEB_DIGEST}"
            echo "${FUNCTIONS_IMAGE}:${TAG}"
            echo "${FUNCTIONS_IMAGE}@${FN_DIGEST}"
            echo '```'
            echo
            echo "Upgrade: set DEVCENTS_VERSION=${TAG} in .env, then docker compose pull && docker compose up -d"
          } > release-notes.md
          gh release create "$TAG" \
            --title "$(git log -1 --pretty=%s)" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "$GITHUB_SHA"
